<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 840" width="1500" height="840" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Vom Terraform-Code zu den Azure-Ressourcen</title>
  <desc id="d">Links die vier Terraform-Dateien im Ordner infra. In der Mitte Terraform mit den Schritten init, plan, apply und destroy und der Zustandsdatei. Rechts Azure mit der Resource Group und ihren acht Ressourcen in Lab 02 und drei weiteren in Lab 03: Storage Account, Container Registry, Managed Identity, Rollenzuweisungen, Log Analytics, Container-Apps-Umgebung und Container App. Terraform liest die Dateien und legt die Ressourcen über die Azure-API an.</desc>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a6fdb"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fb0"/></marker>
  </defs>
  <rect width="1500" height="840" fill="#ffffff"/>
  <text x="30" y="44" font-size="26" font-weight="700" fill="#1f1f1d">Vom Terraform-Code zu den Azure-Ressourcen</text>
  <text x="30" y="72" font-size="16" fill="#5f5f5a">Der Code beschreibt den Soll-Zustand. Terraform vergleicht ihn mit Azure und gleicht ab.</text>

  <!-- column 1: files -->
  <rect x="30" y="100" width="380" height="620" rx="20" fill="#f3f3f1" stroke="#999999" stroke-width="2"/>
  <text x="220" y="135" font-size="19" font-weight="700" text-anchor="middle" fill="#1f1f1d">Dateien im Ordner infra/</text>
  <rect x="50" y="160" width="340" height="120" rx="12" fill="#ffffff" stroke="#b5b5ad"/>
  <text x="70" y="192" font-size="18" font-weight="700" fill="#1f1f1d">main.tf</text>
  <text x="70" y="220" font-size="15" fill="#1f1f1d">die Ressourcen: pro Block eine</text>
  <text x="70" y="242" font-size="15" fill="#1f1f1d">Ressource in Azure (Lab 02: 8, Lab 03: +3)</text>
  <rect x="50" y="295" width="340" height="120" rx="12" fill="#ffffff" stroke="#b5b5ad"/>
  <text x="70" y="327" font-size="18" font-weight="700" fill="#1f1f1d">variables.tf</text>
  <text x="70" y="355" font-size="15" fill="#1f1f1d">Eingaben mit Standardwert:</text>
  <text x="70" y="377" font-size="15" fill="#1f1f1d">Standort, Name (Lab 03: Image-Version)</text>
  <rect x="50" y="430" width="340" height="120" rx="12" fill="#ffffff" stroke="#b5b5ad"/>
  <text x="70" y="462" font-size="18" font-weight="700" fill="#1f1f1d">versions.tf</text>
  <text x="70" y="490" font-size="15" fill="#1f1f1d">welcher Provider (azurerm),</text>
  <text x="70" y="512" font-size="15" fill="#1f1f1d">welche Version, wie angemeldet</text>
  <rect x="50" y="565" width="340" height="120" rx="12" fill="#ffffff" stroke="#b5b5ad"/>
  <text x="70" y="597" font-size="18" font-weight="700" fill="#1f1f1d">outputs.tf</text>
  <text x="70" y="625" font-size="15" fill="#1f1f1d">Ausgaben nach dem Anlegen:</text>
  <text x="70" y="647" font-size="15" fill="#1f1f1d">Registry, Speicher (Lab 03: App)</text>

  <!-- column 2: terraform -->
  <rect x="470" y="100" width="380" height="620" rx="20" fill="#f1e8f8" stroke="#7a3fb0" stroke-width="2"/>
  <text x="660" y="135" font-size="19" font-weight="700" text-anchor="middle" fill="#55257f">Terraform</text>
  <text x="660" y="157" font-size="14" text-anchor="middle" fill="#55257f">Programm im Dev Container</text>
  <rect x="490" y="175" width="340" height="82" rx="12" fill="#ffffff" stroke="#7a3fb0"/>
  <text x="510" y="205" font-size="17" font-weight="700" fill="#1f1f1d">terraform init</text>
  <text x="510" y="232" font-size="15" fill="#1f1f1d">lädt den Azure-Provider herunter</text>
  <rect x="490" y="270" width="340" height="82" rx="12" fill="#ffffff" stroke="#7a3fb0"/>
  <text x="510" y="300" font-size="17" font-weight="700" fill="#1f1f1d">terraform plan</text>
  <text x="510" y="327" font-size="15" fill="#1f1f1d">zeigt, was sich ändern würde</text>
  <rect x="490" y="365" width="340" height="82" rx="12" fill="#ffffff" stroke="#7a3fb0" stroke-width="3"/>
  <text x="510" y="395" font-size="17" font-weight="700" fill="#1f1f1d">terraform apply</text>
  <text x="510" y="422" font-size="15" fill="#1f1f1d">führt die Änderungen aus</text>
  <rect x="490" y="460" width="340" height="82" rx="12" fill="#ffffff" stroke="#7a3fb0"/>
  <text x="510" y="490" font-size="17" font-weight="700" fill="#1f1f1d">terraform destroy</text>
  <text x="510" y="517" font-size="15" fill="#1f1f1d">entfernt alles wieder</text>
  <rect x="490" y="560" width="340" height="140" rx="12" fill="#fbf8fe" stroke="#7a3fb0" stroke-dasharray="7 5"/>
  <text x="510" y="590" font-size="17" font-weight="700" fill="#1f1f1d">terraform.tfstate</text>
  <text x="510" y="617" font-size="15" fill="#1f1f1d">Terraform merkt sich hier, was es</text>
  <text x="510" y="639" font-size="15" fill="#1f1f1d">angelegt hat. Lokale Datei, enthält</text>
  <text x="510" y="661" font-size="15" fill="#1f1f1d">Werte aus Azure, nie ins Repo.</text>

  <!-- arrow files -> terraform -->
  <line x1="410" y1="410" x2="470" y2="410" stroke="#555555" stroke-width="3" marker-end="url(#g)"/>
  <text x="440" y="396" font-size="14" text-anchor="middle" fill="#555555">liest</text>
  <!-- arrow terraform -> azure -->
  <line x1="850" y1="405" x2="910" y2="405" stroke="#2a6fdb" stroke-width="4" marker-end="url(#b)"/>
  <text x="880" y="380" font-size="13" text-anchor="middle" fill="#1a4a9c">legt an,</text>
  <text x="880" y="396" font-size="13" text-anchor="middle" fill="#1a4a9c">ändert,</text>
  <text x="880" y="430" font-size="13" text-anchor="middle" fill="#1a4a9c">löscht</text>

  <!-- column 3: azure -->
  <rect x="910" y="100" width="560" height="620" rx="20" fill="#e6eefb" stroke="#2a6fdb" stroke-width="2"/>
  <text x="1190" y="135" font-size="19" font-weight="700" text-anchor="middle" fill="#1a4a9c">Azure</text>
  <text x="1190" y="157" font-size="14" text-anchor="middle" fill="#1a4a9c">Anmeldung mit az login, Zugriff über die Azure-API</text>
  <rect x="930" y="175" width="520" height="525" rx="14" fill="#f6f9fe" stroke="#2a6fdb" stroke-dasharray="8 5"/>
  <text x="950" y="203" font-size="16" font-weight="700" fill="#1a4a9c">Resource Group rg-docplatform</text>

  <rect x="950" y="225" width="220" height="84" rx="10" fill="#f3f3f1" stroke="#999999" stroke-dasharray="6 4"/>
  <text x="962" y="255" font-size="16" font-weight="700" fill="#555555">Container App · Lab 03</text>
  <text x="962" y="278" font-size="14" fill="#555555">führt das Image aus,</text>
  <text x="962" y="297" font-size="14" fill="#555555">0 bis 2 Replikate</text>
  <rect x="1210" y="225" width="220" height="84" rx="10" fill="#ffffff" stroke="#2a6fdb"/>
  <text x="1222" y="255" font-size="16" font-weight="700" fill="#1f1f1d">Managed Identity</text>
  <text x="1222" y="278" font-size="14" fill="#1f1f1d">Identität der App,</text>
  <text x="1222" y="297" font-size="14" fill="#1f1f1d">ohne Passwort</text>
  <rect x="950" y="335" width="220" height="84" rx="10" fill="#f3f3f1" stroke="#999999" stroke-dasharray="6 4"/>
  <text x="962" y="365" font-size="16" font-weight="700" fill="#555555">Container-Apps-</text>
  <text x="962" y="385" font-size="16" font-weight="700" fill="#555555">Umgebung · Lab 03</text>
  <text x="962" y="406" font-size="14" fill="#555555">gemeinsamer Rahmen</text>
  <rect x="1210" y="335" width="220" height="84" rx="10" fill="#ffffff" stroke="#2a6fdb"/>
  <text x="1222" y="365" font-size="16" font-weight="700" fill="#1f1f1d">Rollenzuweisungen</text>
  <text x="1222" y="388" font-size="14" fill="#1f1f1d">AcrPull auf der Registry,</text>
  <text x="1222" y="407" font-size="14" fill="#1f1f1d">Blob Data Contributor</text>
  <rect x="950" y="445" width="220" height="84" rx="10" fill="#f3f3f1" stroke="#999999" stroke-dasharray="6 4"/>
  <text x="962" y="475" font-size="16" font-weight="700" fill="#555555">Log Analytics · Lab 03</text>
  <text x="962" y="498" font-size="14" fill="#555555">sammelt die Logs</text>
  <rect x="1210" y="445" width="220" height="84" rx="10" fill="#ffffff" stroke="#2a6fdb"/>
  <text x="1222" y="475" font-size="16" font-weight="700" fill="#1f1f1d">Storage Account</text>
  <text x="1222" y="498" font-size="14" fill="#1f1f1d">Container «dokumente»,</text>
  <text x="1222" y="517" font-size="14" fill="#1f1f1d">keine Schlüssel</text>
  <rect x="950" y="555" width="220" height="84" rx="10" fill="#ffffff" stroke="#2a6fdb"/>
  <text x="962" y="585" font-size="16" font-weight="700" fill="#1f1f1d">Container Registry</text>
  <text x="962" y="608" font-size="14" fill="#1f1f1d">nimmt das Image auf,</text>
  <text x="962" y="627" font-size="14" fill="#1f1f1d">die App zieht es von hier</text>
  <rect x="1210" y="555" width="220" height="84" rx="10" fill="#f3f3f1" stroke="#999999" stroke-dasharray="6 4"/>
  <text x="1222" y="585" font-size="16" font-weight="700" fill="#555555">Zufallssuffix</text>
  <text x="1222" y="608" font-size="14" fill="#555555">nur in Terraform, macht</text>
  <text x="1222" y="627" font-size="14" fill="#555555">Namen weltweit eindeutig</text>

  <!-- relations inside azure -->
  <line x1="1170" y1="267" x2="1210" y2="267" stroke="#2a6fdb" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="1190" y="259" font-size="12" text-anchor="middle" fill="#1a4a9c">nutzt</text>
  <line x1="1320" y1="309" x2="1320" y2="335" stroke="#2a6fdb" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="1330" y="326" font-size="12" fill="#1a4a9c">erhält</text>
  <line x1="1320" y1="419" x2="1320" y2="445" stroke="#2a6fdb" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="1330" y="436" font-size="12" fill="#1a4a9c">gilt für</text>
  <line x1="1060" y1="309" x2="1060" y2="335" stroke="#2a6fdb" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="1070" y="326" font-size="12" fill="#1a4a9c">läuft in</text>
  <line x1="1060" y1="419" x2="1060" y2="445" stroke="#2a6fdb" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="1070" y="436" font-size="12" fill="#1a4a9c">Logs an</text>

  <!-- bottom -->
  <text x="30" y="760" font-size="16" fill="#1f1f1d"><tspan font-weight="700">plan</tspan> vergleicht Code und Azure und ändert nichts. <tspan font-weight="700">apply</tspan> führt die Änderungen aus. <tspan font-weight="700">destroy</tspan> entfernt alles, was apply angelegt hat.</text>
  <text x="30" y="788" font-size="16" fill="#1f1f1d">Ein Block im Code entspricht einer Ressource in Azure. Änderungen laufen über den Code, nicht über das Portal.</text>
  <text x="30" y="816" font-size="14" fill="#5f5f5a">Gestrichelt: kommt erst in Lab 03 dazu. Der Standort der Ressourcen ist die Variable location (Standard im Kurs: switzerlandnorth).</text>
</svg>
